name: Update TSP Prices

on:
  schedule:
    # 03:30 UTC, Tue-Sat = ~10:30-11:30pm ET Mon-Fri (DST-dependent).
    # Verified manually: tsp.gov posts the day's closing NAVs by ~11:24pm ET
    # the same evening, so this has margin. Adjust if that timing changes.
    - cron: "30 3 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node scripts/fetch-prices.js

      - name: Commit updated price data
        run: |
          git config user.name "tsp-rotation-bot"
          git config user.email "actions@github.com"
          git add public/data/tsp-prices.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Update TSP price data"
          git push
